<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Smooth rendering -->
  </defs>

  <g id="bhunetra-emblem" transform="translate(50, 20)">
    <!-- Radar Waves emanating from top right -->
    <g id="radar-signals" fill="none" stroke-linecap="round">
      <path d="M 285 140 A 42 42 0 0 1 330 178" stroke="#9ec93b" stroke-width="8" />
      <path d="M 285 108 A 74 74 0 0 1 364 176" stroke="#b8d799" stroke-width="8" />
      <path d="M 285 76 A 106 106 0 0 1 398 174" stroke="#d5e7c3" stroke-width="8" />
    </g>

    <!-- Mountains -->
    <!-- Left dark mountain peak -->
    <path d="M 88 232 L 158 145 L 166 153 L 250 82 L 306 166 L 250 186 Z" fill="#253443" />
    <!-- Dark facet/shadow on left mountain -->
    <path d="M 250 82 L 250 186 L 208 178 Z" fill="#1c2833" />

    <!-- Right green mountain peak -->
    <path d="M 250 186 L 250 126 L 332 178 L 374 236 L 288 194 Z" fill="#597a65" />
    <path d="M 250 126 L 306 166 L 250 186 Z" fill="#44614e" />

    <!-- Eye Graphic -->
    <!-- Upper Eyelid -->
    <path d="M 102 248 C 150 196, 230 182, 250 182 C 270 182, 350 196, 398 248 C 362 216, 296 202, 250 202 C 204 202, 138 216, 102 248 Z" fill="#253443" />
    <!-- Upper Eyelid right flourish crease -->
    <path d="M 334 236 C 360 248, 386 256, 408 258 C 382 252, 354 244, 334 236 Z" fill="#253443" />

    <!-- Lower Eyelid -->
    <path d="M 102 254 C 146 304, 218 318, 250 318 C 282 318, 354 304, 398 254 C 360 292, 292 298, 250 298 C 208 298, 140 292, 102 254 Z" fill="#253443" />

    <!-- Outer Iris Ring (Sage Green) -->
    <circle cx="250" cy="250" r="38" stroke="#597a65" stroke-width="7" fill="#ffffff" />

    <!-- Pupil (Dark Slate Navy) -->
    <circle cx="250" cy="250" r="24" fill="#253443" />

    <!-- Specular Highlight Catchlight (White) -->
    <circle cx="259" cy="241" r="7.5" fill="#ffffff" />
  </g>

  <!-- Typography: Wordmark "BhuNetra" -->
  <g id="bhunetra-wordmark" transform="translate(0, 410)">
    <text x="300" y="0" text-anchor="middle" font-family="system-ui, -apple-system, 'Public Sans', sans-serif" font-weight="800" font-size="64" letter-spacing="-1">
      <tspan fill="#253443">Bhu</tspan><tspan fill="#597a65">Netr</tspan><tspan fill="#597a65" font-size="54">a</tspan>
    </text>
  </g>

  <!-- Tagline: "— See Risk, Save Lives —" -->
  <g id="bhunetra-tagline" transform="translate(0, 448)">
    <line x1="145" y1="-8" x2="185" y2="-8" stroke="#9ec93b" stroke-width="3" stroke-linecap="round" />
    <text x="300" y="0" text-anchor="middle" fill="#253443" font-family="system-ui, -apple-system, 'Source Sans 3', sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">
      See Risk, Save Lives
    </text>
    <line x1="415" y1="-8" x2="455" y2="-8" stroke="#9ec93b" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
